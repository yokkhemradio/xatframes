<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>MYRADIOhit Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background: transparent;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 10px;
            height: 100vh;
            overflow: hidden;
        }

        /* จัดโครงสร้างคอลัมน์ซ้าย-ขวา ขยับลงมา 90px */
        .column {
            transform: translateY(90px);
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 🎬 1. ส่วนภาพ/วิดีโอ ปรับความสูงเป็น 486px */
        .box-media {
            width: 100%;
            height: 486px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative; /* สำคัญสำหรับจัดตำแหน่งปุ่มทับบนภาพ */
        }
        .box-media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
        }

        /* 🔘 ปุ่มลิงก์ทับอยู่บนภาพด้านซ้าย */
        .overlay-buttons {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            gap: 4px;
            z-index: 10;
        }
        .overlay-btn {
            background: rgba(15, 23, 42, 0.8);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 5px 6px;
            font-size: 10px;
            font-weight: bold;
            border-radius: 4px;
            text-decoration: none;
            text-align: center;
            flex: 1;
            backdrop-filter: blur(4px);
            transition: 0.2s;
        }
        .overlay-btn:hover {
            background: rgba(56, 189, 248, 0.9);
            color: #0f172a;
        }

        /* สไตล์สำหรับภาพสไลด์วนลูป 6 ภาพ (ฝั่งขวา) */
        .slideshow-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .slide-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        .slide-img.active {
            opacity: 1;
        }

        /* 📻 2. ส่วนวิทยุ/Playlist ขนาดเล็กต่อท้ายด้านล่าง */
        .box-sub {
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* วิทยุด้านซ้าย */
        .player-top {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .vinyl-box {
            width: 36px;
            height: 36px;
            background: #000;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #1e293b;
        }
        .vinyl-center {
            width: 12px;
            height: 12px;
            background: #0ea5e9;
            border-radius: 50%;
        }
        .player-info {
            overflow: hidden;
        }
        .player-header {
            font-size: 10px;
            color: #94a3b8;
        }
        .track-title {
            font-size: 11px;
            font-weight: bold;
            color: #38bdf8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        audio {
            width: 100%;
            height: 28px;
        }

        /* Playlist ด้านขวา */
        .playlist-title {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }
        .playlist-item {
            padding: 6px;
            background: rgba(30, 41, 59, 0.6);
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 11px;
        }
        .playlist-item:hover {
            background: rgba(56, 189, 248, 0.3);
        }
        .playlist-item .cat {
            font-size: 9px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <!-- 👈 ฝั่งซ้าย: วิดีโอสูง 486px + ปุ่มทับบนภาพ + วิทยุเล็กๆ ด้านล่าง -->
    <div class="column">
        <div class="box-media">
            <!-- ปุ่มลิงก์ทั้ง 3 ปุ่ม ทับอยู่บนภาพ -->
            <div class="overlay-buttons">
                <a href="https://yokkhemradio.blogspot.com/" target="_blank" class="overlay-btn">🌐 หน้าเว็บ</a>
                <a href="https://www.facebook.com/kontairadio/" target="_blank" class="overlay-btn">📘 เฟสบุค</a>
                <a href="https://www.youtube.com/@plangtai2569" target="_blank" class="overlay-btn">▶️ ยูทูบ</a>
            </div>

            <video autoplay loop muted playsinline>
                <source src="https://files.catbox.moe/yc18zg.mp4" type="video/mp4">
            </video>
        </div>

        <div class="box-sub">
            <div class="player-top">
                <div class="vinyl-box">
                    <div class="vinyl-center"></div>
                </div>
                <div class="player-info">
                    <div class="player-header">Myradiohit Player</div>
                    <div class="track-title" id="current-title">Select a track</div>
                </div>
            </div>
            <audio id="audio-player" controls></audio>
        </div>
    </div>

    <!-- 👉 ฝั่งขวา: 6 ภาพหมุนวนลูปอัตโนมัติ (ความสูง 486px) + Playlist -->
    <div class="column">
        <div class="box-media">
            <div class="slideshow-container" id="slideshow">
                <img src="https://xatimg.com/image/UF03TNbTlmet.png" class="slide-img active" alt="Slide 1">
                <img src="https://xatimg.com/image/YFikinqnBrTe.png" class="slide-img" alt="Slide 2">
                <img src="https://xatimg.com/image/hk6O1PF9FQvv.png" class="slide-img" alt="Slide 3">
                <img src="https://xatimg.com/image/xTh1qgAYVVEh.png" class="slide-img" alt="Slide 4">
                <img src="https://xatimg.com/image/pvPcRwrnwK3q.png" class="slide-img" alt="Slide 5">
                <img src="https://xatimg.com/image/QaF2rYyp97VI.png" class="slide-img" alt="Slide 6">
            </div>
        </div>

        <div class="box-sub">
            <div class="playlist-title">Playlist</div>
            <div class="playlist-item" onclick="playTrack('สตริงใหม่ล่าสุด', 'https://ia600607.us.archive.org/28/items/sting-new/sting%20new.mp3')">
                <div>#1 Tag Hits String 2026</div>
                <div class="cat">Category: String</div>
            </div>
        </div>
    </div>

    <script>
        function playTrack(title, url) {
            const player = document.getElementById('audio-player');
            const titleElement = document.getElementById('current-title');
            
            titleElement.innerText = title;
            player.src = url;
            player.play();
        }

        // ระบบสลับภาพวนลูปอัตโนมัติ (ทุกๆ 3 วินาที)
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide-img');
        
        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        // ตั้งเวลาเปลี่ยนภาพทุก 3,000 มิลลิวินาที (3 วินาที)
        setInterval(nextSlide, 3000);
    </script>
</body>
</html>
