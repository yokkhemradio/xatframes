<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>หยกเข้มเรดิโอ เพลงเพราะ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 🌌 วิดีโอพื้นหลังเต็มหน้าจอ ปิดเสียงสนิท */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
            pointer-events: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: transparent;
            color: #fff;
            overflow: hidden;
        }

        /* 📌 วางชิดขอบซ้าย ขยับลงมา 90px เท่าตอนทำวิทยุ 2 ด้าน */
        .player-container {
            position: fixed;
            top: 90px;
            left: 15px;
            width: 275px;
            background: transparent;
            border: 1.5px solid rgba(56, 189, 248, 0.65);
            border-radius: 12px;
            padding: 12px 14px;
            z-index: 99999;
            pointer-events: auto;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95);
        }

        .player-header {
            font-size: 13px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .live-badge {
            background: rgba(239, 68, 68, 0.9);
            color: #fff;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
        }
        .track-title {
            font-size: 12px;
            color: #ffffff;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* แผงปุ่มควบคุม */
        .control-panel {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .btn-ctrl {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
            transition: transform 0.15s;
            position: relative;
            z-index: 10;
        }
        .btn-play { background: #10b981; color: #fff; }
        .btn-pause { background: #f59e0b; color: #fff; }
        .btn-stop { background: #ef4444; color: #fff; }
        .btn-ctrl:hover { transform: scale(1.1); }
        .btn-ctrl:active { transform: scale(0.95); }
        .btn-ctrl svg, .btn-ctrl path {
            width: 16px;
            height: 16px;
            fill: currentColor;
            pointer-events: none;
        }

        /* แถบปรับเสียง (โปร่งใส) */
        .volume-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: 1px solid rgba(56, 189, 248, 0.45);
            padding: 6px 10px;
            border-radius: 20px;
        }
        .volume-box svg { width: 16px; height: 16px; fill: #38bdf8; flex-shrink: 0; pointer-events: none; }
        .volume-slider {
            width: 100%;
            accent-color: #38bdf8;
            cursor: pointer;
        }

        /* 📌 วางชิดขอบขวา ขยับลงมา 90px เท่ากัน */
        .playlist-container {
            position: fixed;
            top: 90px;
            right: 15px;
            width: 275px;
            background: transparent;
            border: 1.5px solid rgba(56, 189, 248, 0.65);
            border-radius: 12px;
            padding: 12px 14px;
            max-height: 80vh;
            overflow-y: auto;
            z-index: 99999;
            pointer-events: auto;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95);
        }
        .playlist-title {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 5px;
            color: #38bdf8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .playlist-item {
            padding: 8px 10px;
            margin-bottom: 6px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-left: 3px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 12px;
        }
        .playlist-item:last-child {
            margin-bottom: 0;
        }
        .playlist-item:hover {
            background: rgba(56, 189, 248, 0.25);
        }
        .playlist-item.active {
            background: rgba(14, 165, 233, 0.3);
            border-left: 3px solid #38bdf8;
        }
        .playlist-item .cat {
            font-size: 10px;
            color: #e2e8f0;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <!-- 🌌 วิดีโอพื้นหลัง Background (ปิดเสียงสนิท) -->
    <video id="bg-video" class="bg-video" src="https://ia601504.us.archive.org/26/items/hailuo3_202611/hailuo3.mp4" autoplay loop muted playsinline></video>

    <!-- 🎧 เครื่องเล่นเพลงด้านซ้าย (top: 90px) -->
    <div class="player-container">
        <div class="player-header">
            <span>🎧 หยกเข้มเรดิโอ เพลงเพราะ</span>
            <span class="live-badge" id="status-badge">READY</span>
        </div>
        <div class="track-title" id="current-title">กด Play หรือเลือกรายการด้านขวา</div>

        <div class="control-panel">
            <button type="button" class="btn-ctrl btn-play" onclick="handlePlay()" title="เล่น (Play)">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button type="button" class="btn-ctrl btn-pause" onclick="handlePause()" title="พักชั่วคราว (Pause)">
                <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button type="button" class="btn-ctrl btn-stop" onclick="handleStop()" title="หยุดเล่น (Stop)">
                <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
            </button>
        </div>

        <div class="volume-box">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <input type="range" min="0" max="1" step="0.05" value="1" class="volume-slider" oninput="changeVolume(this.value)">
        </div>
    </div>

    <!-- 📻 รายการเพลงไทยด้านขวา (top: 90px) -->
    <div class="playlist-container">
        <div class="playlist-title">
            <span>รายการเพลงไทย</span>
            <span style="font-size: 10px;">AUTO-NEXT</span>
        </div>
        
        <div id="item-0" class="playlist-item" onclick="startPlaylist(0)">
            <div>1. รวมเพลงเพราะต่อเนื่อง </div>
            <div class="cat">เล่นต่อเนื่อง: เพลงฮิต 2026 → สตริงใหม่ → Hit Mix</div>
        </div>
        <div id="item-1" class="playlist-item" onclick="startPlaylist(3)">
            <div>2. เพลงสตริงใหม่ล่าสุด</div>
            <div class="cat">หมวดหมู่: Live Radio 128 kbps</div>
        </div>
    </div>

    <audio id="audio-player" preload="none"></audio>

    <script>
        // บังคับปิดเสียงวิดีโอพื้นหลัง 100%
        const bgVideo = document.getElementById('bg-video');
        bgVideo.muted = true;
        bgVideo.volume = 0;

        // คิวเพลงทั้งหมด (3 เพลงแรกอยู่ในชุด "รวมเพลงไทยต่อเนื่อง 3 ชุด" และอันที่ 4 คือวิทยุสด)
        const tracks = [
            {
                group: 0,
                title: 'ชุดต่อเนื่อง (1/3): เพลงไทยแนะนำ 2026',
                url: 'https://files.catbox.moe/f2ngzy.mp3'
            },
            {
                group: 0,
                title: 'ชุดต่อเนื่อง (2/3): สตริงใหม่ล่าสุด 2026',
                url: 'https://ia600607.us.archive.org/28/items/sting-new/sting%20new.mp3'
            },
            {
                group: 0,
                title: 'ชุดต่อเนื่อง (3/3): Sting Hit Mix',
                url: 'https://ia601808.us.archive.org/30/items/stinghit/stinghit.mp3'
            },
            {
                group: 1,
                title: 'เพลงสตริงใหม่ล่าสุด)',
                url: 'https://files.catbox.moe/9j6qln.mp3'
            }
        ];

        let currentIndex = 0;
        let isPaused = false;
        const player = document.getElementById('audio-player');
        const titleElement = document.getElementById('current-title');
        const statusBadge = document.getElementById('status-badge');

        function highlightGroup(groupIdx) {
            document.getElementById('item-0').classList.toggle('active', groupIdx === 0);
            document.getElementById('item-1').classList.toggle('active', groupIdx === 1);
        }

        function startPlaylist(index) {
            currentIndex = index;
            isPaused = false;
            
            player.pause();
            player.src = tracks[index].url;
            player.load();
            
            titleElement.innerText = tracks[index].title;
            statusBadge.innerText = "PLAYING";
            statusBadge.style.background = "#10b981";
            highlightGroup(tracks[index].group);

            player.play().catch(e => {
                statusBadge.innerText = "ERROR";
            });
        }

        function handlePlay() {
            if (isPaused && player.src) {
                isPaused = false;
                player.play();
                titleElement.innerText = tracks[currentIndex].title;
                statusBadge.innerText = "PLAYING";
                statusBadge.style.background = "#10b981";
            } else {
                startPlaylist(currentIndex);
            }
        }

        function handlePause() {
            player.pause();
            isPaused = true;
            titleElement.innerText = "พักชั่วคราว: " + tracks[currentIndex].title;
            statusBadge.innerText = "PAUSED";
            statusBadge.style.background = "#f59e0b";
        }

        function handleStop() {
            player.pause();
            player.currentTime = 0;
            player.src = "";
            player.removeAttribute('src');
            player.load();
            isPaused = false;
            currentIndex = 0;
            titleElement.innerText = "หยุดเล่นเพลงแล้ว";
            statusBadge.innerText = "STOPPED";
            statusBadge.style.background = "#ef4444";
            highlightGroup(-1);
        }

        function changeVolume(val) {
            player.volume = val;
        }

        // เมื่อเพลงจบ: ถ้าอยู่ในชุด 3 เพลงต่อเนื่อง (index 0, 1, 2) จะเล่นวนต่อเนื่องกันทั้ง 3 เพลงอัตโนมัติ
        player.addEventListener('ended', () => {
            if (tracks[currentIndex].group === 0) {
                const nextInMix = (currentIndex + 1) % 3; // 0 -> 1 -> 2 -> 0 ต่อเนื่อง
                startPlaylist(nextInMix);
            } else {
                startPlaylist(currentIndex);
            }
        });
    </script>
</body>
</html>
