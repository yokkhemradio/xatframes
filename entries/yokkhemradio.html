<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yokkhemradio Player for XatRadio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        .radio-frame-container {
            width: 100vw;
            height: 100vh;
            border: none;
            outline: none;
            display: block;
            background: transparent;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            outline: 0;
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="radio-frame-container">
        <iframe 
            src="https://xatradio.com/player/j2xbsq4vf.html" 
            allow="autoplay; encrypted-media; microphone; camera"
            allowtransparency="true"
            scrolling="no"
            frameborder="0">
        </iframe>
    </div>

</body>
</html>
