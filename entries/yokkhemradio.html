<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>หยกเข้มเรดิโอ เพลงเพราะ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 🌌 วิดีโอพื้นหลังเต็มหน้าจอ ปิดเสียงสนิท */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
            pointer-events: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: transparent;
            color: #fff;
            overflow: hidden;
        }

        /* 📌 วิทยุทดลองวางไว้บนสุดชิดขวา */
        .top-radio-container {
            position: fixed;
            top: 5px;
            right: 10px;
            width: 245px;
            background: rgba(15, 23, 42, 0.35);
            border: 1.5px solid rgba(56, 189, 248, 0.8);
            border-radius: 10px;
            padding: 6px;
            z-index: 2147483647;
            pointer-events: auto;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95);
        }

        .top-radio-label {
            font-size: 11px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }

        .open-ext-btn {
            background: rgba(56, 189, 248, 0.25);
            border: 1px solid rgba(56, 189, 248, 0.6);
            color: #fde047;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            white-space: nowrap;
        }
        .open-ext-btn:hover {
            background: rgba(56, 189, 248, 0.45);
        }

        .radio-frame-box {
            width: 100%;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(56, 189, 248, 0.45);
            background: rgba(0, 0, 0, 0.25);
        }

        /* 📌 ตัวเล่นวิทยุหลักและแถบสถานะ ถัดลงมาด้านขวา */
        .player-container {
            position: fixed;
            top: 242px;
            right: 10px;
            width: 245px;
            background: transparent;
            border: 1.5px solid rgba(56, 189, 248, 0.75);
            border-radius: 12px;
            padding: 10px 12px;
            max-height: 60vh;
            overflow-y: auto;
            z-index: 2147483646;
            pointer-events: auto;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95);
        }

        .player-header {
            font-size: 12px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 4px;
        }
        .live-badge {
            background: rgba(239, 68, 68, 0.92);
            color: #fff;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: bold;
            flex-shrink: 0;
        }
        .track-title {
            font-size: 11px;
            color: #ffffff;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* แผงปุ่มควบคุม */
        .control-panel {
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 8px;
            margin-bottom: 8px;
        }
        .btn-ctrl {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,255,255,0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.7);
            transition: transform 0.15s;
            pointer-events: auto;
        }
        .btn-play { background: #10b981; color: #fff; }
        .btn-pause { background: #f59e0b; color: #fff; }
        .btn-stop { background: #ef4444; color: #fff; }
        .btn-ctrl:hover { transform: scale(1.08); }
        .btn-ctrl:active { transform: scale(0.94); }
        .btn-ctrl svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
            pointer-events: none;
        }

        /* แถบปรับเสียง */
        .volume-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: 1px solid rgba(56, 189, 248, 0.5);
            padding: 4px 8px;
            border-radius: 20px;
        }
        .volume-box svg { width: 14px; height: 14px; fill: #38bdf8; flex-shrink: 0; pointer-events: none; }
        .volume-slider {
            width: 100%;
            accent-color: #38bdf8;
            cursor: pointer;
        }

        /* ✨ ข้อความเชิญชวน */
        .after-tracks-note {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed rgba(255, 255, 255, 0.25);
            font-size: 11px;
            color: #fde047;
            text-align: center;
            line-height: 1.4;
        }

        /* 📊 EQ + นาฬิกาและวันที่ */
        .right-footer-widget {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .eq-box {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 16px;
        }

        .eq-bar {
            width: 3px;
            height: 100%;
            background: linear-gradient(to top, #0072ff, #38bdf8);
            border-radius: 2px;
            transform-origin: bottom;
            transform: scaleY(0.25);
        }

        .eq-box.playing .eq-bar:nth-child(1) { animation: eqMove 0.55s infinite alternate ease-in-out; }
        .eq-box.playing .eq-bar:nth-child(2) { animation: eqMove 0.4s infinite alternate ease-in-out 0.1s; }
        .eq-box.playing .eq-bar:nth-child(3) { animation: eqMove 0.65s infinite alternate ease-in-out 0.2s; }
        .eq-box.playing .eq-bar:nth-child(4) { animation: eqMove 0.48s infinite alternate ease-in-out 0.15s; }
        .eq-box.playing .eq-bar:nth-child(5) { animation: eqMove 0.6s infinite alternate ease-in-out 0.05s; }

        @keyframes eqMove {
            0% { transform: scaleY(0.2); }
            100% { transform: scaleY(1); }
        }

        .clock-box {
            text-align: right;
            font-size: 10px;
            line-height: 1.3;
        }

        .clock-time {
            font-family: monospace;
            font-size: 11px;
            font-weight: bold;
            color: #ffffff;
        }

        .clock-date {
            font-size: 9px;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <!-- 🌌 วิดีโอพื้นหลัง Background (ปิดเสียงสนิท) -->
    <video id="bg-video" class="bg-video" src="https://ia601504.us.archive.org/26/items/hailuo3_202611/hailuo3.mp4" autoplay loop muted playsinline></video>

    <!-- 📻 วิทยุทดลองวางไว้บนสุด -->
    <div class="top-radio-container" id="top-radio">
        <div class="top-radio-label">
            <span>📻 RADIO 9</span>
            <a class="open-ext-btn" href="https://radio.plathong.net/main/player/?server=radio9&port=7264" target="_blank" rel="noopener noreferrer">เปิดหน้าต่างใหม่</a>
        </div>
        <div class="radio-frame-box">
            <iframe src="https://radio.plathong.net/main/player/?server=radio9&port=7264" width="100%" height="180" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>

    <!-- 🎧 เครื่องเล่นวิทยุหลักและแถบสถานะด้านล่าง -->
    <div class="player-container" id="radio-player">
        <div class="player-header">
            <span>🎧 หยกเข้มเรดิโอ</span>
            <span class="live-badge" id="status-badge">READY</span>
        </div>
        <div class="track-title" id="current-title">✨ กด Play เพื่อฟังเพลงต่อเนื่องได้เลยครับ</div>

        <div class="control-panel">
            <button type="button" class="btn-ctrl btn-play" id="btn-play" title="เล่น (Play)">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button type="button" class="btn-ctrl btn-pause" id="btn-pause" title="พักชั่วคราว (Pause)">
                <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button type="button" class="btn-ctrl btn-stop" id="btn-stop" title="หยุดเล่น (Stop)">
                <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
            </button>
        </div>

        <div class="volume-box">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <input type="range" min="0" max="1" step="0.05" value="1" class="volume-slider" id="vol-slider">
        </div>

        <!-- ✨ ข้อความเชิญชวน -->
        <div class="after-tracks-note">
            🎶 กด Play ด้านบนเพื่อฟังเพลงต่อเนื่องได้เลยครับ<br>
            เปิดฟังเพลินๆ ตลอดทั้งวันกับ หยกเข้มเรดิโอ เพลงเพราะ ✨
        </div>

        <!-- 📊 EQ + นาฬิกาและวันที่ -->
        <div class="right-footer-widget">
            <div class="eq-box" id="eq-box">
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
            </div>
            <div class="clock-box">
                <div class="clock-time" id="clock-time">00:00:00</div>
                <div class="clock-date" id="clock-date">00/00/0000</div>
            </div>
        </div>
    </div>

    <audio id="audio-player" preload="auto"></audio>

    <script>
        const bgVideo = document.getElementById('bg-video');
        bgVideo.muted = true;
        bgVideo.volume = 0;

        // เพลงชุดต่อเนื่องสำหรับปุ่มควบคุมหลัก
        const tracks = [
            {
                title: 'ชุดต่อเนื่อง (1/4): เพลงไทยแนะนำ 2026',
                url: 'https://files.catbox.moe/f2ngzy.mp3'
            },
            {
                title: 'ชุดต่อเนื่อง (2/4): สตริงใหม่ล่าสุด 2026',
                url: 'https://ia600607.us.archive.org/28/items/sting-new/sting%20new.mp3'
            },
            {
                title: 'ชุดต่อเนื่อง (3/4): Sting Hit Mix',
                url: 'https://ia601808.us.archive.org/30/items/stinghit/stinghit.mp3'
            },
            {
                title: 'ชุดต่อเนื่อง (4/4): เพลงสตริงใหม่ล่าสุด',
                url: 'https://files.catbox.moe/9j6qln.mp3'
            }
        ];

        let currentIndex = 0;
        let isPaused = false;
        let currentVolume = 1;
        const player = document.getElementById('audio-player');
        const titleElement = document.getElementById('current-title');
        const statusBadge = document.getElementById('status-badge');
        const eqBox = document.getElementById('eq-box');

        function setEqState(playing) {
            if (playing) {
                eqBox.classList.add('playing');
            } else {
                eqBox.classList.remove('playing');
            }
        }

        function startPlaylist(index = 0) {
            currentIndex = index;
            isPaused = false;

            player.pause();
            player.muted = false;
            player.volume = currentVolume;
            player.src = tracks[currentIndex].url;
            player.load();

            titleElement.innerText = tracks[currentIndex].title;
            statusBadge.innerText = "RADIO";
            statusBadge.style.background = "#10b981";
            setEqState(true);

            const p = player.play();
            if (p !== undefined) {
                p.catch(() => {
                    statusBadge.innerText = "TAP PLAY";
                    setEqState(false);
                });
            }
        }

        function handlePlay() {
            if (isPaused && player.src) {
                isPaused = false;
                player.muted = false;
                player.volume = currentVolume;
                player.play().catch(() => {});
                titleElement.innerText = tracks[currentIndex].title;
                statusBadge.innerText = "RADIO";
                statusBadge.style.background = "#10b981";
                setEqState(true);
            } else {
                startPlaylist(currentIndex);
            }
        }

        function handlePause() {
            player.pause();
            isPaused = true;
            titleElement.innerText = "พักชั่วคราว: " + tracks[currentIndex].title;
            statusBadge.innerText = "PAUSED";
            statusBadge.style.background = "#f59e0b";
            setEqState(false);
        }

        function handleStop() {
            player.pause();
            player.muted = true;
            player.volume = 0;
            player.currentTime = 0;
            player.removeAttribute('src');
            player.src = '';
            player.load();
            isPaused = false;
            currentIndex = 0;
            titleElement.innerText = "หยุดเล่นเพลงแล้ว";
            statusBadge.innerText = "STOPPED";
            statusBadge.style.background = "#ef4444";
            setEqState(false);
        }

        function bindAction(el, fn) {
            el.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                fn();
            });
            el.addEventListener('click', (e) => {
                e.stopPropagation();
            });
        }

        bindAction(document.getElementById('btn-play'), handlePlay);
        bindAction(document.getElementById('btn-pause'), handlePause);
        bindAction(document.getElementById('btn-stop'), handleStop);

        document.getElementById('vol-slider').addEventListener('input', (e) => {
            currentVolume = parseFloat(e.target.value);
            player.volume = currentVolume;
            if (currentVolume > 0) player.muted = false;
        });

        player.addEventListener('ended', () => {
            const nextIndex = (currentIndex + 1) % tracks.length;
            startPlaylist(nextIndex);
        });

        // 🕒 นาฬิกาเวลาและวันที่
        function updateClock() {
            const now = new Date();
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const mo = String(now.getMonth() + 1).padStart(2, '0');
            const yyyy = now.getFullYear();

            document.getElementById('clock-time').innerText = `${hh}:${mm}:${ss}`;
            document.getElementById('clock-date').innerText = `${dd}/${mo}/${yyyy}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
