<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>หยกเข้มเรดิโอ เพลงเพราะ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 🌌 วิดีโอพื้นหลังเต็มหน้าจอ ปิดเสียงสนิท */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
            pointer-events: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: transparent;
            color: #fff;
            overflow: hidden;
        }

        /* 📌 กล่องเพลง (ตัวเล่นวิทยุ) ด้านบนขวา */
        .player-container {
            position: fixed;
            top: 15px;
            right: 10px;
            width: 245px;
            background: transparent;
            border: 1.5px solid rgba(56, 189, 248, 0.75);
            border-radius: 12px;
            padding: 10px 12px;
            z-index: 2147483647;
            pointer-events: auto;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95);
        }

        .player-header {
            font-size: 12px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 4px;
        }
        .live-badge {
            background: rgba(239, 68, 68, 0.92);
            color: #fff;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: bold;
            flex-shrink: 0;
        }
        .track-title {
            font-size: 11px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* แผงปุ่มควบคุม */
        .control-panel {
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 8px;
            margin-bottom: 10px;
        }
        .btn-ctrl {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,255,255,0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.7);
            transition: transform 0.15s;
            pointer-events: auto;
        }
        .btn-play { background: #10b981; color: #fff; }
        .btn-pause { background: #f59e0b; color: #fff; }
        .btn-stop { background: #ef4444; color: #fff; }
        .btn-ctrl:hover { transform: scale(1.08); }
        .btn-ctrl:active { transform: scale(0.94); }
        .btn-ctrl svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            pointer-events: none;
        }

        /* แถบปรับเสียง */
        .volume-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: 1px solid rgba(56, 189, 248, 0.5);
            padding: 5px 8px;
            border-radius: 20px;
        }
        .volume-box svg { width: 15px; height: 15px; fill: #38bdf8; flex-shrink: 0; pointer-events: none; }
        .volume-slider {
            width: 100%;
            accent-color: #38bdf8;
            cursor: pointer;
        }

        /* 📌 กรอบรายชื่อเพลงตามไทม์ไลน์ ใต้กล่องเพลง */
        .playlist-container {
            position: fixed;
            top: 175px;
            right: 10px;
            width: 245px;
            background: transparent;
            border: 1.5px solid rgba(56, 189, 248, 0.75);
            border-radius: 12px;
            padding: 10px 12px;
            max-height: calc(100vh - 188px);
            display: flex;
            flex-direction: column;
            z-index: 2147483646;
            pointer-events: auto;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95);
        }

        .playlist-title {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 5px;
            color: #38bdf8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .song-list {
            flex: 1;
            min-height: 120px;
            max-height: 250px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-right: 2px;
        }

        .song-list::-webkit-scrollbar {
            width: 4px;
        }
        .song-list::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.55);
            border-radius: 4px;
        }

        .song-row {
            padding: 5px 8px;
            background: rgba(15, 23, 42, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-left: 3px solid transparent;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.15s;
            font-size: 11px;
            pointer-events: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .song-row:hover {
            background: rgba(56, 189, 248, 0.28);
        }
        .song-row.active {
            background: rgba(14, 165, 233, 0.38);
            border-left: 3px solid #38bdf8;
            color: #fde047;
            font-weight: bold;
        }
        .song-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .song-time {
            font-family: monospace;
            font-size: 9px;
            color: #38bdf8;
            flex-shrink: 0;
        }

        /* ✨ ข้อความเชิญชวนใต้รายชื่อเพลง */
        .after-tracks-note {
            margin-top: 7px;
            padding-top: 7px;
            border-top: 1px dashed rgba(255, 255, 255, 0.25);
            font-size: 10px;
            color: #fde047;
            text-align: center;
            line-height: 1.4;
            flex-shrink: 0;
        }

        /* 📊 EQ + นาฬิกาและวันที่ */
        .right-footer-widget {
            margin-top: 7px;
            padding-top: 7px;
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .eq-box {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 16px;
        }

        .eq-bar {
            width: 3px;
            height: 100%;
            background: linear-gradient(to top, #0072ff, #38bdf8);
            border-radius: 2px;
            transform-origin: bottom;
            transform: scaleY(0.25);
        }

        .eq-box.playing .eq-bar:nth-child(1) { animation: eqMove 0.55s infinite alternate ease-in-out; }
        .eq-box.playing .eq-bar:nth-child(2) { animation: eqMove 0.4s infinite alternate ease-in-out 0.1s; }
        .eq-box.playing .eq-bar:nth-child(3) { animation: eqMove 0.65s infinite alternate ease-in-out 0.2s; }
        .eq-box.playing .eq-bar:nth-child(4) { animation: eqMove 0.48s infinite alternate ease-in-out 0.15s; }
        .eq-box.playing .eq-bar:nth-child(5) { animation: eqMove 0.6s infinite alternate ease-in-out 0.05s; }

        @keyframes eqMove {
            0% { transform: scaleY(0.2); }
            100% { transform: scaleY(1); }
        }

        .clock-box {
            text-align: right;
            font-size: 10px;
            line-height: 1.3;
        }

        .clock-time {
            font-family: monospace;
            font-size: 11px;
            font-weight: bold;
            color: #ffffff;
        }

        .clock-date {
            font-size: 9px;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <!-- 🌌 วิดีโอพื้นหลัง Background (ปิดเสียงสนิท) -->
    <video id="bg-video" class="bg-video" src="https://ia601504.us.archive.org/26/items/hailuo3_202611/hailuo3.mp4" autoplay loop muted playsinline></video>

    <!-- 🎧 กล่องเพลง (ตัวเล่นวิทยุ) ด้านบนขวา -->
    <div class="player-container" id="radio-player">
        <div class="player-header">
            <span>🎧 หยกเข้มเรดิโอ</span>
            <span class="live-badge" id="status-badge">READY</span>
        </div>
        <div class="track-title" id="current-title">🎵 ไม่ดี...มีทำไม</div>

        <div class="control-panel">
            <button type="button" class="btn-ctrl btn-play" id="btn-play" title="เล่น (Play)">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button type="button" class="btn-ctrl btn-pause" id="btn-pause" title="พักชั่วคราว (Pause)">
                <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button type="button" class="btn-ctrl btn-stop" id="btn-stop" title="หยุดเล่น (Stop)">
                <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
            </button>
        </div>

        <div class="volume-box">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <input type="range" min="0" max="1" step="0.05" value="1" class="volume-slider" id="vol-slider">
        </div>
    </div>

    <!-- 📻 กล่องรายชื่อเพลงตามไทม์ไลน์ ใต้กล่องเพลง -->
    <div class="playlist-container" id="right-playlist">
        <div class="playlist-title">
            <span>รายชื่อเพลง</span>
            <span style="font-size: 10px;" id="song-count-label">32 เพลง</span>
        </div>

        <div class="song-list" id="song-list"></div>

        <!-- ✨ ข้อความเชิญชวนใต้รายชื่อเพลง -->
        <div class="after-tracks-note">
            🎶 เปลี่ยนชื่อเพลงตามเวลาอัตโนมัติ หรือแตะเลือกฟังได้เลยครับ<br>
            เปิดฟังเพลินๆ กับ หยกเข้มเรดิโอ เพลงเพราะ ✨
        </div>

        <!-- 📊 EQ + นาฬิกาและวันที่ -->
        <div class="right-footer-widget">
            <div class="eq-box" id="eq-box">
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
            </div>
            <div class="clock-box">
                <div class="clock-time" id="clock-time">00:00:00</div>
                <div class="clock-date" id="clock-date">00/00/0000</div>
            </div>
        </div>
    </div>

    <audio id="audio-player" preload="auto"></audio>

    <script>
        const bgVideo = document.getElementById('bg-video');
        bgVideo.muted = true;
        bgVideo.volume = 0;

        const AUDIO_URL = 'https://files.catbox.moe/9kjrgk.mp3';

        const chapters = [
            { time: '00:00', seconds: 0, title: 'ไม่ดี...มีทำไม' },
            { time: '03:59', seconds: 239, title: 'รักแย่ก็แค่...Move On' },
            { time: '07:19', seconds: 439, title: 'คนจำไม่เคยลืม คนลืมไม่เคยจำ' },
            { time: '11:12', seconds: 672, title: 'ฉันยังเชื่อในตัวเธอ' },
            { time: '14:59', seconds: 899, title: 'คนถัดไปไม่มีจริง' },
            { time: '19:08', seconds: 1148, title: 'วิวาห์สุดท้าย' },
            { time: '23:23', seconds: 1403, title: 'ไปไกลๆไม่คืนดี' },
            { time: '26:54', seconds: 1614, title: 'ฤดูฝนคนเจ็บ' },
            { time: '30:50', seconds: 1850, title: 'อธิษฐานให้ฉันลืมเธอ' },
            { time: '35:10', seconds: 2110, title: 'ลืมแฟนเก่ายังไง' },
            { time: '39:10', seconds: 2350, title: 'เป็นแฟนเก่ามันไม่ง่าย' },
            { time: '43:34', seconds: 2614, title: 'กำลังใจใกล้ฉัน' },
            { time: '47:07', seconds: 2827, title: 'นักซัปพอร์ตที่ดี' },
            { time: '50:48', seconds: 3048, title: 'เก่งที่สุดคือเรื่องจำ' },
            { time: '54:28', seconds: 3268, title: 'สั้นๆ ง่ายๆ' },
            { time: '58:15', seconds: 3495, title: 'เรื่องมันเศร้า ขอเล่าข้างๆ' },
            { time: '1:01:49', seconds: 3709, title: 'ให้อภัยไม่ลง' },
            { time: '1:05:15', seconds: 3915, title: 'ไปจบกับคนเก่าให้ได้ก่อน' },
            { time: '1:09:26', seconds: 4166, title: 'หยุดชั่วคราว (Pause)' },
            { time: '1:13:39', seconds: 4419, title: 'ความรักกำลัง Landing' },
            { time: '1:17:01', seconds: 4621, title: 'ทฤษฎีรถไฟ' },
            { time: '1:20:52', seconds: 4852, title: 'HBD ที่ไม่มีเธอ' },
            { time: '1:24:18', seconds: 5058, title: 'เย็นชา ชาเย็น' },
            { time: '1:27:12', seconds: 5232, title: 'ความทรงจำ (วันนี้ในอดีต)' },
            { time: '1:30:52', seconds: 5452, title: 'เรื่องแฟนเก่าไปเล่าไกลๆ' },
            { time: '1:34:21', seconds: 5661, title: 'กลับมาเพื่อบอกลาถาวร' },
            { time: '1:38:13', seconds: 5893, title: 'ฤดูฝนคนเหงา' },
            { time: '1:41:57', seconds: 6117, title: 'แค่รักอย่างเดียวไม่พอ' },
            { time: '1:45:27', seconds: 6327, title: 'สะดวกรัก 24 ชั่วโมง' },
            { time: '1:48:47', seconds: 6527, title: 'เศรษฐีดู(ใบ)' },
            { time: '1:51:57', seconds: 6717, title: 'ฮีลใจที่ชายทะเล' },
            { time: '1:54:57', seconds: 6897, title: 'พรุ่งนี้...ยังอยากมีเธอให้รัก' },
            { time: '1:59:08', seconds: 7148, title: 'ความรักยังมีลมหายใจ' }
        ];

        let currentChapterIndex = 0;
        let isPaused = false;
        let currentVolume = 1;
        const player = document.getElementById('audio-player');
        const titleElement = document.getElementById('current-title');
        const statusBadge = document.getElementById('status-badge');
        const eqBox = document.getElementById('eq-box');
        const songListEl = document.getElementById('song-list');

        document.getElementById('song-count-label').innerText = `${chapters.length} เพลง`;

        function bindAction(el, fn) {
            el.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                fn();
            });
            el.addEventListener('click', (e) => {
                e.stopPropagation();
            });
        }

        function setEqState(playing) {
            if (playing) {
                eqBox.classList.add('playing');
            } else {
                eqBox.classList.remove('playing');
            }
        }

        function updateActiveChapterUI(index, autoScroll = false) {
            currentChapterIndex = index;
            const ch = chapters[index];
            if (!isPaused && player.src) {
                titleElement.innerText = `🎵 ${ch.title}`;
            }
            for (let i = 0; i < chapters.length; i++) {
                const row = document.getElementById('song-' + i);
                if (row) row.classList.toggle('active', i === index);
            }
            if (autoScroll) {
                const activeRow = document.getElementById('song-' + index);
                if (activeRow) {
                    activeRow.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                }
            }
        }

        function findChapterBySeconds(sec) {
            let found = 0;
            for (let i = 0; i < chapters.length; i++) {
                if (sec >= chapters[i].seconds) {
                    found = i;
                } else {
                    break;
                }
            }
            return found;
        }

        function renderSongList() {
            songListEl.innerHTML = '';
            chapters.forEach((ch, idx) => {
                const row = document.createElement('div');
                row.id = 'song-' + idx;
                row.className = 'song-row' + (idx === currentChapterIndex ? ' active' : '');

                const nameSpan = document.createElement('span');
                nameSpan.className = 'song-name';
                nameSpan.innerText = `${idx + 1}. ${ch.title}`;

                const timeSpan = document.createElement('span');
                timeSpan.className = 'song-time';
                timeSpan.innerText = ch.time;

                row.appendChild(nameSpan);
                row.appendChild(timeSpan);
                bindAction(row, () => playChapter(idx));
                songListEl.appendChild(row);
            });
        }

        function ensureSrcLoaded() {
            if (!player.src || !player.src.includes('9kjrgk.mp3')) {
                player.src = AUDIO_URL;
                player.load();
            }
        }

        function playChapter(index = 0) {
            isPaused = false;
            ensureSrcLoaded();
            player.muted = false;
            player.volume = currentVolume;

            const targetSec = chapters[index].seconds;
            const applySeekAndPlay = () => {
                try {
                    player.currentTime = targetSec;
                } catch (_) {}
                updateActiveChapterUI(index, true);
                statusBadge.innerText = "RADIO";
                statusBadge.style.background = "#10b981";
                setEqState(true);

                const p = player.play();
                if (p !== undefined) {
                    p.catch(() => {
                        statusBadge.innerText = "TAP PLAY";
                        setEqState(false);
                    });
                }
            };

            if (player.readyState >= 1) {
                applySeekAndPlay();
            } else {
                const onLoaded = () => {
                    player.removeEventListener('loadedmetadata', onLoaded);
                    applySeekAndPlay();
                };
                player.addEventListener('loadedmetadata', onLoaded);
                player.load();
            }
        }

        function handlePlay() {
            if (isPaused && player.src) {
                isPaused = false;
                player.muted = false;
                player.volume = currentVolume;
                const idx = findChapterBySeconds(player.currentTime || 0);
                updateActiveChapterUI(idx, false);
                titleElement.innerText = `🎵 ${chapters[idx].title}`;
                statusBadge.innerText = "RADIO";
                statusBadge.style.background = "#10b981";
                setEqState(true);
                player.play().catch(() => {});
            } else {
                playChapter(currentChapterIndex);
            }
        }

        function handlePause() {
            player.pause();
            isPaused = true;
            const ch = chapters[currentChapterIndex];
            titleElement.innerText = `พัก: ${ch.title}`;
            statusBadge.innerText = "PAUSED";
            statusBadge.style.background = "#f59e0b";
            setEqState(false);
        }

        function handleStop() {
            player.pause();
            player.muted = true;
            player.volume = 0;
            player.currentTime = 0;
            player.removeAttribute('src');
            player.src = '';
            player.load();
            isPaused = false;
            currentChapterIndex = 0;
            titleElement.innerText = "หยุดเล่นเพลงแล้ว";
            statusBadge.innerText = "STOPPED";
            statusBadge.style.background = "#ef4444";
            updateActiveChapterUI(0, false);
            setEqState(false);
        }

        player.addEventListener('timeupdate', () => {
            if (isPaused) return;
            const idx = findChapterBySeconds(player.currentTime || 0);
            if (idx !== currentChapterIndex) {
                updateActiveChapterUI(idx, true);
            }
        });

        player.addEventListener('ended', () => {
            playChapter(0);
        });

        renderSongList();
        bindAction(document.getElementById('btn-play'), handlePlay);
        bindAction(document.getElementById('btn-pause'), handlePause);
        bindAction(document.getElementById('btn-stop'), handleStop);

        document.getElementById('vol-slider').addEventListener('input', (e) => {
            currentVolume = parseFloat(e.target.value);
            player.volume = currentVolume;
            if (currentVolume > 0) player.muted = false;
        });

        // 🕒 นาฬิกาเวลาและวันที่
        function updateClock() {
            const now = new Date();
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const mo = String(now.getMonth() + 1).padStart(2, '0');
            const yyyy = now.getFullYear();

            document.getElementById('clock-time').innerText = `${hh}:${mm}:${ss}`;
            document.getElementById('clock-date').innerText = `${dd}/${mo}/${yyyy}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
