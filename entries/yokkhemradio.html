<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yokkhemradio Dual Columns</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }
        body {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 10px;
            position: relative;
            height: 100vh;
        }

        /* 🎬 วิดีโอพื้นหลัง (Background Video) */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -10;
            filter: brightness(0.55);
            pointer-events: none;
        }

        /* จัดโครงสร้างคอลัมน์ซ้าย-ขวา ให้แยกห่างกันซ้ายสุด-ขวาสุดเหมือนเดิม */
        .column {
            transform: translateY(90px);
            width: 270px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
            position: relative;
        }

        /* 🎬 กล่องแสดงโลโก้พรีเมียม (ปรับโปร่งใส) */
        .box-media {
            position: relative;
            width: 100%;
            height: 486px;
            background: transparent;
            border: none;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: none;
        }

        /* 🔄 อนิเมชันโลโก้หมุนวนลูปฝั่งซ้าย */
        @keyframes spinLogo {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 💓 อนิเมชันโลโก้เต้นตามจังหวะฝั่งขวา */
        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.6)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 25px rgba(14, 165, 233, 0.9)); }
        }

        .watermark-logo-spin {
            width: 140px;
            height: 140px;
            object-fit: contain;
            z-index: 10;
            pointer-events: none;
            animation: spinLogo 10s linear infinite;
        }

        .watermark-logo-pulse {
            width: 140px;
            height: 140px;
            object-fit: contain;
            z-index: 10;
            pointer-events: none;
            animation: pulseLogo 3s ease-in-out infinite;
        }

        /* 🏷️ กล่องข้อความพรีเมียม */
        .title-badge {
            margin-top: 15px;
            padding: 6px 16px;
            background: rgba(14, 165, 233, 0.2);
            border: 1px solid rgba(56, 189, 248, 0.5);
            border-radius: 20px;
            color: #38bdf8;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
        }

        /* 🎵 ปุ่มควบคุมเล่น/หยุดเพลง */
        .overlay-play-btn {
            position: absolute;
            bottom: 25px;
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 10px 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.5);
            transition: all 0.3s ease;
            z-index: 20;
        }
        .overlay-play-btn:hover {
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.8);
        }
        .overlay-play-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <!-- 🌌 วิดีโอพื้นหลัง -->
    <video autoplay loop muted playsinline class="bg-video">
        <source src="https://files.catbox.moe/7jjbip.mp4" type="video/mp4">
    </video>

    <!-- 👈 คอลัมน์ฝั่งซ้าย: โลโก้หมุน + ปุ่มควบคุมเพลงเดิม -->
    <div class="column">
        <div class="box-media">
            <img src="https://xatimg.com/image/CuEn64l0inCG.png" alt="Logo Spin" class="watermark-logo-spin">
            <div class="title-badge">📻 YOKKHEM RADIO</div>
            <button class="overlay-play-btn" onclick="togglePlay('audio-left', 'https://ia600607.us.archive.org/28/items/sting-new/sting%20new.mp3', 'play-text-left')">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <span id="play-text-left">เล่นเพลง</span>
            </button>
        </div>
    </div>

    <!-- 👉 คอลัมน์ฝั่งขวา: โลโก้เรืองแสง + เพลงใหม่ของคุณ -->
    <div class="column">
        <div class="box-media">
            <img src="https://xatimg.com/image/CuEn64l0inCG.png" alt="Logo Pulse" class="watermark-logo-pulse">
            <div class="title-badge">🎙️ หยกเข้มเรดิโอ</div>
            <button class="overlay-play-btn" onclick="togglePlay('audio-right', 'https://files.catbox.moe/0jsiqe.mp3', 'play-text-right')">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <span id="play-text-right">เล่นเพลง</span>
            </button>
        </div>
    </div>

    <!-- 🎵 เครื่องเล่นเสียงแยกอิสระซ้าย/ขวา -->
    <audio id="audio-left"></audio>
    <audio id="audio-right"></audio>

    <script>
        function togglePlay(audioId, url, textId) {
            const player = document.getElementById(audioId);
            const leftPlayer = document.getElementById('audio-left');
            const rightPlayer = document.getElementById('audio-right');
            const btnText = document.getElementById(textId);
            const textLeft = document.getElementById('play-text-left');
            const textRight = document.getElementById('play-text-right');

            // หยุดเพลงฝั่งตรงข้ามเพื่อให้เล่นไม่ทับกัน
            if (audioId === 'audio-left') {
                rightPlayer.pause();
                if(textRight) textRight.innerText = "เล่นเพลง";
            } else {
                leftPlayer.pause();
                if(textLeft) textLeft.innerText = "เล่นเพลง";
            }

            if (player.src === url && !player.paused) {
                player.pause();
                if(btnText) btnText.innerText = "เล่นเพลง";
            } else {
                player.src = url;
                player.play().then(() => {
                    if(btnText) btnText.innerText = "หยุดเพลง";
                }).catch(e => console.log('Audio autoplay blocked'));
            }
        }
    </script>
</body>
</html>
