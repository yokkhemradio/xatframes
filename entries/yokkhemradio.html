<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yokkhemradio Dual Columns with XatRadio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }
        body {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 10px;
            position: relative;
            height: 100vh;
        }

        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -10;
            filter: brightness(0.55);
            pointer-events: none;
        }

        .column {
            transform: translateY(60px);
            width: 270px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
            position: relative;
        }

        .box-media {
            position: relative;
            width: 100%;
            background: transparent;
            border: none;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: none;
            padding: 10px;
        }

        @keyframes spinLogo {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.6)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 25px rgba(14, 165, 233, 0.9)); }
        }

        .watermark-logo-spin {
            width: 110px;
            height: 110px;
            object-fit: contain;
            z-index: 10;
            pointer-events: none;
            animation: spinLogo 10s linear infinite;
        }

        .watermark-logo-pulse {
            width: 110px;
            height: 110px;
            object-fit: contain;
            z-index: 10;
            pointer-events: none;
            animation: pulseLogo 3s ease-in-out infinite;
        }

        .title-badge {
            margin-top: 6px;
            margin-bottom: 6px;
            padding: 4px 12px;
            background: rgba(14, 165, 233, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 20px;
            color: #38bdf8;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
        }

        .radio-frame-container {
            width: 100%;
            height: 75px;
            background: transparent;
            border: none;
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: none;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }

        .radio-frame-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }
    </style>
</head>
<body>

    <video autoplay loop muted playsinline class="bg-video">
        <source src="https://files.catbox.moe/7jjbip.mp4" type="video/mp4">
    </video>

    <div class="column">
        <div class="box-media">
            <img src="https://xatimg.com/image/CuEn64l0inCG.png" alt="Logo Spin" class="watermark-logo-spin">
            <div class="title-badge">📻 YOKKHEM RADIO</div>
            
            <div class="radio-frame-container">
                <iframe id="radioFrame1" src="https://xatradio.com/player/j2xbsq4vf.html" allow="autoplay"></iframe>
            </div>
        </div>
    </div>

    <div class="column">
        <div class="box-media">
            <img src="https://xatimg.com/image/CuEn64l0inCG.png" alt="Logo Pulse" class="watermark-logo-pulse">
            <div class="title-badge">🎙️ หยกเข้มเรดิโอ</div>
            
            <div class="radio-frame-container">
                <iframe id="radioFrame2" src="https://xatradio.com/player/j2xbsq4vf.html" allow="autoplay"></iframe>
            </div>
        </div>
    </div>

</body>
</html>
