<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>MYRADIOhit Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 🌌 วิดีโอพื้นหลัง Background เต็มหน้าจอ */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
            pointer-events: none;
        }

        body {
            background: transparent;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 10px;
            height: 100vh;
            overflow: hidden;
        }

        /* เครื่องเล่นวิทยุด้านซ้าย (ตำแหน่งเดิมที่กดติดใน xatframes + พื้นหลังโปร่งใส) */
        .player-container {
            width: 310px;
            margin-top: 60px;
            background: transparent;
            border: 1.5px solid rgba(56, 189, 248, 0.55);
            border-radius: 12px;
            padding: 15px;
            z-index: 2;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95);
        }
        .player-header {
            font-size: 13px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .live-badge {
            background: rgba(239, 68, 68, 0.85);
            color: #fff;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
        }
        .track-title {
            font-size: 12px;
            color: #ffffff;
            margin-bottom: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* แผงปุ่มควบคุม */
        .control-panel {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .btn-ctrl {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            transition: 0.2s;
        }
        .btn-play { background: #10b981; color: #fff; }
        .btn-pause { background: #f59e0b; color: #fff; }
        .btn-stop { background: #ef4444; color: #fff; }
        .btn-ctrl:hover { transform: scale(1.1); }
        .btn-ctrl svg { width: 16px; height: 16px; fill: currentColor; }

        /* แถบปรับเสียง (โปร่งใส) */
        .volume-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 7px 12px;
            border-radius: 20px;
        }
        .volume-box svg { width: 16px; height: 16px; fill: #38bdf8; }
        .volume-slider {
            width: 100%;
            accent-color: #38bdf8;
            cursor: pointer;
        }

        /* Playlist ด้านขวา (ตำแหน่งเดิมที่กดติดใน xatframes + พื้นหลังโปร่งใส) */
        .playlist-container {
            width: 280px;
            margin-top: 10px;
            background: transparent;
            border: 1.5px solid rgba(56, 189, 248, 0.55);
            border-radius: 10px;
            padding: 15px;
            max-height: 90vh;
            overflow-y: auto;
            z-index: 2;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95);
        }
        .playlist-title {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.25);
            padding-bottom: 5px;
            color: #38bdf8;
            display: flex;
            justify-content: space-between;
        }
        .playlist-item {
            padding: 8px;
            margin-bottom: 6px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 3px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 12px;
        }
        .playlist-item:last-child {
            margin-bottom: 0;
        }
        .playlist-item:hover {
            background: rgba(56, 189, 248, 0.25);
        }
        .playlist-item.active {
            background: rgba(14, 165, 233, 0.25);
            border-left: 3px solid #38bdf8;
        }
        .playlist-item .cat {
            font-size: 10px;
            color: #e2e8f0;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <!-- 🌌 วิดีโอพื้นหลัง Background ตัวใหม่ (ปิดเสียงสนิท) -->
    <video id="bg-video" class="bg-video" src="https://ia601504.us.archive.org/26/items/hailuo3_202611/hailuo3.mp4" autoplay loop muted playsinline></video>

    <!-- ส่วนเครื่องเล่นเพลงด้านซ้าย -->
    <div class="player-container">
        <div class="player-header">
            <span>🎧 MYRADIOHIT PLAYER</span>
            <span class="live-badge">LIVE</span>
        </div>
        <div class="track-title" id="current-title">กำลังเตรียมพร้อม: เลือกเพลงไทยเพื่อฟัง</div>

        <div class="control-panel">
            <button class="btn-ctrl btn-play" onclick="playAudio()" title="เล่น (Play)">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="btn-ctrl btn-pause" onclick="pauseAudio()" title="พัก (Pause)">
                <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button class="btn-ctrl btn-stop" onclick="stopAudio()" title="หยุด (Stop)">
                <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
            </button>
        </div>

        <div class="volume-box">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <input type="range" min="0" max="1" step="0.05" value="1" class="volume-slider" oninput="changeVolume(this.value)">
        </div>

        <audio id="audio-player"></audio>
    </div>

    <!-- ส่วนรายการเพลงไทย Playlist ด้านขวา -->
    <div class="playlist-container">
        <div class="playlist-title">
            <span>รายการเพลงไทย (PLAYLIST)</span>
            <span style="font-size: 10px;">AUTO-NEXT</span>
        </div>
        
        <div id="item-0" class="playlist-item" onclick="selectTrack(0)">
            <div>1. สตริงใหม่ล่าสุด (Tag Hits String 2026)</div>
            <div class="cat">หมวดหมู่: เพลงสตริงฮิต</div>
        </div>
        <div id="item-1" class="playlist-item" onclick="selectTrack(1)">
            <div>2. Sting Hit Mix (รวมฮิตสตริงต่อเนื่อง)</div>
            <div class="cat">หมวดหมู่: Hit Mix</div>
        </div>
        <div id="item-2" class="playlist-item" onclick="selectTrack(2)">
            <div>3. สถานีวิทยุสด (MYRADIOHIT LIVE)</div>
            <div class="cat">หมวดหมู่: Live Radio 128 kbps</div>
        </div>
    </div>

    <script>
        // บังคับปิดเสียงวิดีโอพื้นหลัง 100%
        const bgVideo = document.getElementById('bg-video');
        bgVideo.muted = true;
        bgVideo.volume = 0;

        // รายการเพลงไทยทั้งหมด
        const tracks = [
            {
                title: '1. สตริงใหม่ล่าสุด (Tag Hits String 2026)',
                url: 'https://ia600607.us.archive.org/28/items/sting-new/sting%20new.mp3'
            },
            {
                title: '2. Sting Hit Mix (รวมฮิตสตริงต่อเนื่อง)',
                url: 'https://ia601808.us.archive.org/30/items/stinghit/stinghit.mp3'
            },
            {
                title: '3. สถานีวิทยุสด (MYRADIOHIT LIVE)',
                url: 'https://files.catbox.moe/9j6qln.mp3'
            }
        ];

        let currentIndex = 0;
        const player = document.getElementById('audio-player');
        const titleElement = document.getElementById('current-title');

        function highlightTrack(index) {
            tracks.forEach((_, idx) => {
                const el = document.getElementById(`item-${idx}`);
                if (el) {
                    el.classList.toggle('active', idx === index);
                }
            });
        }

        function selectTrack(index) {
            currentIndex = index;
            titleElement.innerText = "กำลังเล่น: " + tracks[index].title;
            player.src = tracks[index].url;
            highlightTrack(index);
            player.play().catch(e => console.log("Play blocked"));
        }

        function playAudio() {
            if (player.src) {
                player.play().catch(e => console.log("Play blocked"));
            } else {
                selectTrack(0);
            }
        }

        function pauseAudio() {
            player.pause();
            titleElement.innerText = "พักการเล่น: " + tracks[currentIndex].title;
        }

        function stopAudio() {
            player.pause();
            player.currentTime = 0;
            titleElement.innerText = "หยุดเล่นเพลงแล้ว";
        }

        function changeVolume(val) {
            player.volume = val;
        }

        // เล่นเพลงถัดไปอัตโนมัติเมื่อจบเพลง
        player.addEventListener('ended', () => {
            const nextIndex = (currentIndex + 1) % tracks.length;
            selectTrack(nextIndex);
        });
    </script>
</body>
</html>
