<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYRADIOhit Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            overflow: hidden;
            position: relative;
        }
        body {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 15px 25px;
        }

        /* 🎬 วิดีโอพื้นหลังเต็มจอ 100% ชัดเจน ไม่โดนบัง และปิดเสียงสนิท */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
            opacity: 1;
            pointer-events: none;
        }

        /* ✨ แสงเอฟเฟกต์เคลื่อนไหววนลูปบางๆ ทับด้านบน (ไม่บังภาพ) */
        #bg-effect-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            mix-blend-mode: screen;
        }

        /* จัดโครงสร้างคอลัมน์ซ้าย-ขวา ขยับลงมา 90px */
        .column {
            transform: translateY(90px);
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
            position: relative;
        }

        /* 🎬 1. ส่วนกล่องแสดงโลโก้หมุน สูง 486px */
        .box-media {
            position: relative;
            width: 100%;
            height: 486px;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(3px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 🔄 อนิเมชันหมุนวนลูป */
        @keyframes spinLogo {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* โลโก้หมุนตรงกลาง */
        .watermark-logo {
            width: 135px;
            height: 135px;
            object-fit: contain;
            z-index: 10;
            pointer-events: none;
            animation: spinLogo 6s linear infinite;
            filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.6));
        }

        /* 🎵 ปุ่มควบคุมเล่น/หยุดเพลง */
        .overlay-play-btn {
            position: absolute;
            bottom: 20px;
            background: rgba(14, 165, 233, 0.9);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            transition: all 0.25s ease;
            z-index: 20;
        }
        .overlay-play-btn:hover {
            background: rgba(56, 189, 248, 1);
            transform: scale(1.1);
        }
        .overlay-play-btn.playing {
            background: #ec4899;
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.7);
        }
        .overlay-play-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* 📻 2. ส่วนวิทยุ/Playlist ด้านล่าง */
        .box-sub {
            width: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 10px 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
        }

        .player-top {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .vinyl-box {
            width: 38px;
            height: 38px;
            background: radial-gradient(circle, #1e293b 30%, #000 70%);
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #38bdf8;
        }
        .vinyl-box.spinning {
            animation: spinLogo 3s linear infinite;
        }
        .vinyl-center {
            width: 12px;
            height: 12px;
            background: #38bdf8;
            border-radius: 50%;
        }
        .player-info {
            overflow: hidden;
        }
        .player-header {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
        }
        .track-title {
            font-size: 12px;
            font-weight: bold;
            color: #38bdf8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        audio {
            width: 100%;
            height: 30px;
            border-radius: 6px;
        }

        /* Playlist ขวา */
        .playlist-title {
            font-size: 12px;
            font-weight: bold;
            color: #e2e8f0;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }
        .playlist-item {
            padding: 7px 9px;
            background: rgba(30, 41, 59, 0.65);
            border-left: 3px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 11px;
            margin-bottom: 5px;
        }
        .playlist-item:last-child {
            margin-bottom: 0;
        }
        .playlist-item:hover {
            background: rgba(56, 189, 248, 0.25);
        }
        .playlist-item.active {
            background: rgba(14, 165, 233, 0.3);
            border-left: 3px solid #38bdf8;
        }
        .playlist-item .cat {
            font-size: 9px;
            color: #94a3b8;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <!-- 🎬 วิดีโอพื้นหลังเต็มจอ 100% และปิดเสียงสนิท -->
    <video id="bg-video" src="https://files.catbox.moe/7jr67s.mp4" autoplay loop muted playsinline preload="auto" class="bg-video"></video>

    <!-- ✨ แคนวาสแสงเอฟเฟกต์วนลูปต่อเนื่อง -->
    <canvas id="bg-effect-canvas"></canvas>

    <!-- 👈 ฝั่งซ้าย: โลโก้หมุน + ปุ่มเล่นเพลง + ตัวเล่นเพลง -->
    <div class="column">
        <div class="box-media">
            <img src="https://xatimg.com/image/CuEn64l0inCG.png" alt="Logo" class="watermark-logo">
            
            <button id="btn-track-0" class="overlay-play-btn" style="right: 15px;" onclick="toggleTrack(0)" title="เล่น/หยุด สตริงใหม่ล่าสุด">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
        </div>

        <div class="box-sub">
            <div class="player-top">
                <div id="vinyl" class="vinyl-box">
                    <div class="vinyl-center"></div>
                </div>
                <div class="player-info">
                    <div class="player-header">MYRADIOHIT PLAYER</div>
                    <div class="track-title" id="current-title">เลือกเพลงเพื่อเริ่มฟัง</div>
                </div>
            </div>
            <audio id="audio-player" controls></audio>
        </div>
    </div>

    <!-- 👉 ฝั่งขวา: โลโก้หมุน + ปุ่มเล่นเพลง + Playlist -->
    <div class="column">
        <div class="box-media">
            <img src="https://xatimg.com/image/CuEn64l0inCG.png" alt="Logo" class="watermark-logo">
            
            <button id="btn-track-1" class="overlay-play-btn" style="left: 15px;" onclick="toggleTrack(1)" title="เล่น/หยุด Sting Hit Mix">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
        </div>

        <div class="box-sub">
            <div class="playlist-title">
                <span>PLAYLIST</span>
                <span style="color: #38bdf8; font-size: 10px;">AUTO-NEXT</span>
            </div>
            <div id="item-0" class="playlist-item" onclick="playTrack(0)">
                <div>#1 Tag Hits String 2026 (สตริงใหม่ล่าสุด)</div>
                <div class="cat">Category: String</div>
            </div>
            <div id="item-1" class="playlist-item" onclick="playTrack(1)">
                <div>#2 Sting Hit Mix</div>
                <div class="cat">Category: Hit Mix</div>
            </div>
        </div>
    </div>

    <script>
        // ✨ 1. แสงเอฟเฟกต์วนลูปต่อเนื่องบน Canvas
        const canvas = document.getElementById('bg-effect-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth || document.documentElement.clientWidth || 1280;
            canvas.height = window.innerHeight || document.documentElement.clientHeight || 720;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const orbs = Array.from({ length: 24 }, (_, i) => ({
            x: Math.random() * 1400,
            y: Math.random() * 900,
            r: 2 + Math.random() * 4,
            vx: (Math.random() - 0.5) * 0.8,
            vy: (Math.random() - 0.5) * 0.8,
            hue: [195, 325, 265, 170][i % 4],
            phase: Math.random() * Math.PI * 2
        }));

        let tick = 0;
        function renderLightEffect() {
            tick += 0.015;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // ลำแสงกวาดวนลูปกลางจอแบบโปร่งแสง
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(tick * 0.35);
            const beamGrad = ctx.createLinearGradient(-canvas.width, 0, canvas.width, 0);
            beamGrad.addColorStop(0, 'rgba(56, 189, 248, 0)');
            beamGrad.addColorStop(0.5, 'rgba(56, 189, 248, 0.14)');
            beamGrad.addColorStop(1, 'rgba(236, 72, 153, 0)');
            ctx.fillStyle = beamGrad;
            ctx.fillRect(-canvas.width, -110, canvas.width * 2, 220);
            ctx.restore();

            // ละอองแสงเรืองแสงวนลูป
            orbs.forEach(orb => {
                orb.x += orb.vx + Math.cos(tick + orb.phase) * 0.35;
                orb.y += orb.vy + Math.sin(tick + orb.phase) * 0.35;
                orb.phase += 0.035;

                if (orb.x < -30) orb.x = canvas.width + 30;
                if (orb.x > canvas.width + 30) orb.x = -30;
                if (orb.y < -30) orb.y = canvas.height + 30;
                if (orb.y > canvas.height + 30) orb.y = -30;

                const glow = 0.4 + 0.4 * Math.sin(orb.phase);
                const radGrad = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, orb.r * 5);
                radGrad.addColorStop(0, `hsla(${orb.hue}, 95%, 65%, ${glow})`);
                radGrad.addColorStop(1, `hsla(${orb.hue}, 95%, 50%, 0)`);

                ctx.beginPath();
                ctx.arc(orb.x, orb.y, orb.r * 5, 0, Math.PI * 2);
                ctx.fillStyle = radGrad;
                ctx.fill();
            });

            requestAnimationFrame(renderLightEffect);
        }
        renderLightEffect();

        // 🎬 2. ปิดเสียงวิดีโอพื้นหลังสนิท 100% และให้เล่นวนลูปตลอดเวลา
        const bgVideo = document.getElementById('bg-video');

        function forceMuteBgVideo() {
            bgVideo.muted = true;
            bgVideo.defaultMuted = true;
            bgVideo.volume = 0;
        }

        function keepBgVideoPlaying() {
            forceMuteBgVideo();
            bgVideo.loop = true;
            if (bgVideo.paused) {
                bgVideo.play().catch(() => {});
            }
        }

        forceMuteBgVideo();
        keepBgVideoPlaying();
        bgVideo.addEventListener('volumechange', forceMuteBgVideo);
        bgVideo.addEventListener('ended', () => {
            bgVideo.currentTime = 0;
            keepBgVideoPlaying();
        });
        setInterval(keepBgVideoPlaying, 2000);
        document.addEventListener('click', keepBgVideoPlaying, { once: true });

        // 🎵 3. ระบบเครื่องเล่นเพลงและ Playlist
        const playlist = [
            {
                title: 'สตริงใหม่ล่าสุด (Tag Hits String 2026)',
                url: 'https://ia600607.us.archive.org/28/items/sting-new/sting%20new.mp3'
            },
            {
                title: 'Sting Hit Mix',
                url: 'https://ia601808.us.archive.org/30/items/stinghit/stinghit.mp3'
            }
        ];

        let currentIndex = -1;
        const player = document.getElementById('audio-player');
        const titleElement = document.getElementById('current-title');
        const vinyl = document.getElementById('vinyl');

        const playIconSVG = '<svg viewBox="0 0 24 24" style="margin-left:2px;"><path d="M8 5v14l11-7z"/></svg>';
        const pauseIconSVG = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

        function updateUI(isPlaying) {
            playlist.forEach((_, idx) => {
                const btn = document.getElementById(`btn-track-${idx}`);
                const item = document.getElementById(`item-${idx}`);

                if (idx === currentIndex && isPlaying) {
                    btn.innerHTML = pauseIconSVG;
                    btn.classList.add('playing');
                    item.classList.add('active');
                } else {
                    btn.innerHTML = playIconSVG;
                    btn.classList.remove('playing');
                    if (idx === currentIndex) {
                        item.classList.add('active');
                    } else {
                        item.classList.remove('active');
                    }
                }
            });

            if (isPlaying) {
                vinyl.classList.add('spinning');
            } else {
                vinyl.classList.remove('spinning');
            }
        }

        function playTrack(index) {
            currentIndex = index;
            titleElement.innerText = playlist[index].title;
            player.src = playlist[index].url;
            player.play();
        }

        function toggleTrack(index) {
            if (currentIndex === index) {
                if (player.paused) {
                    player.play();
                } else {
                    player.pause();
                }
            } else {
                playTrack(index);
            }
        }

        player.addEventListener('play', () => updateUI(true));
        player.addEventListener('pause', () => updateUI(false));
        player.addEventListener('ended', () => {
            const nextIndex = (currentIndex + 1) % playlist.length;
            playTrack(nextIndex);
        });
    </script>
</body>
</html>
