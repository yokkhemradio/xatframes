<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>หยกเข้มเรดิโอ เพลงเพราะ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: transparent;
            color: #fff;
            overflow: hidden;
        }

        /* 🌌 วิดีโอพื้นหลังเต็มหน้าจอ ปิดเสียงสนิท */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
            pointer-events: none;
        }

        /* 💿 โลโก้แผ่นเสียงด้านซ้ายมือ กึ่งกลางระหว่างขอบซ้ายกับกล่องแชท (สลับ 6 ภาพ + หมุนตอนเล่นเพลง) */
        .vinyl-container {
            position: fixed;
            top: 50%;
            left: calc((100vw - 728px) / 4 + 14px);
            transform: translate(-50%, -50%);
            width: 175px;
            z-index: 2147483645;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .vinyl-disc {
            width: 175px;
            height: 175px;
            border-radius: 50%;
            object-fit: cover;
            border: 2.5px solid rgba(56, 189, 248, 0.9);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.85), 0 0 18px rgba(56, 189, 248, 0.45);
            animation: vinylSpin 5s linear infinite;
            animation-play-state: paused;
            transition: opacity 0.45s ease-in-out;
            opacity: 1;
        }

        .vinyl-disc.fading {
            opacity: 0.15;
        }

        .vinyl-container.spinning .vinyl-disc {
            animation-play-state: running;
        }

        @keyframes vinylSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .vinyl-copyright {
            margin-top: 8px;
            font-size: 9.5px;
            font-weight: 600;
            color: rgba(226, 232, 240, 0.88);
            text-align: center;
            white-space: nowrap;
            letter-spacing: 0.2px;
            text-shadow: 0 1px 3px #000, 0 0 8px #000;
        }

        /* 📻 กล่องวิทยุปลาทองด้านบนขวา แทนกล่องปุ่มควบคุมทั้งหมด */
        .plathong-right-box {
            position: fixed;
            top: 15px;
            right: 10px;
            width: 280px;
            height: 180px;
            background: rgba(2, 6, 23, 0.45);
            border: 1.5px solid rgba(56, 189, 248, 0.85);
            border-radius: 12px;
            padding: 4px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.75);
            z-index: 2147483647;
            pointer-events: auto;
            overflow: hidden;
        }

        .plathong-right-box iframe {
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 8px;
            display: block;
        }

        /* 📌 กรอบรายชื่อเพลง ใต้กล่องวิทยุปลาทองด้านขวา */
        .playlist-container {
            position: fixed;
            top: 205px;
            right: 10px;
            width: 280px;
            background: rgba(2, 6, 23, 0.35);
            border: 1.5px solid rgba(56, 189, 248, 0.85);
            border-radius: 12px;
            padding: 10px 12px;
            max-height: calc(100vh - 218px);
            display: flex;
            flex-direction: column;
            z-index: 2147483646;
            pointer-events: auto;
            touch-action: manipulation;
            overflow: hidden;
            text-shadow: 0 1px 3px #000, 0 0 8px #000;
        }

        /* 🖼️ ภาพพื้นหลังด้านในกรอบรายชื่อเพลง */
        .playlist-bg-art {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 15%;
            opacity: 0.45;
            pointer-events: none;
            z-index: 0;
            border-radius: 12px;
        }

        .playlist-content {
            position: relative;
            z-index: 2;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
        }

        .playlist-title {
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.35);
            padding-bottom: 5px;
            color: #7dd3fc;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .song-list {
            position: relative;
            z-index: 3;
            flex: 1;
            min-height: 95px;
            max-height: 210px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-right: 2px;
            pointer-events: auto;
            touch-action: manipulation;
        }

        .song-list::-webkit-scrollbar {
            width: 4px;
        }

        .song-list::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.65);
            border-radius: 4px;
        }

        .song-row {
            position: relative;
            z-index: 4;
            padding: 5px 8px;
            background: rgba(2, 6, 23, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-left: 3px solid transparent;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.15s;
            font-size: 11px;
            pointer-events: auto;
            touch-action: manipulation;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .song-row:hover {
            background: rgba(14, 165, 233, 0.42);
            border-color: rgba(125, 211, 252, 0.6);
        }

        .song-row.active {
            background: rgba(14, 165, 233, 0.55);
            border-color: #38bdf8;
            border-left: 3px solid #fde047;
            color: #fef08a;
            font-weight: 800;
        }

        .song-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ffffff;
            pointer-events: none;
        }

        .song-row.active .song-name {
            color: #fef08a;
        }

        .song-tag {
            font-size: 9px;
            font-weight: bold;
            color: #7dd3fc;
            flex-shrink: 0;
            pointer-events: none;
        }

        .after-tracks-note {
            margin-top: 7px;
            padding: 5px 6px 2px;
            border-top: 1px dashed rgba(255, 255, 255, 0.35);
            background: rgba(2, 6, 23, 0.5);
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            color: #fef08a;
            text-align: center;
            line-height: 1.45;
            flex-shrink: 0;
        }

        .right-footer-widget {
            margin-top: 7px;
            padding-top: 7px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .eq-box {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 16px;
        }

        .eq-bar {
            width: 3px;
            height: 100%;
            background: linear-gradient(to top, #0072ff, #38bdf8);
            border-radius: 2px;
            transform-origin: bottom;
            transform: scaleY(0.25);
        }

        .eq-box.playing .eq-bar:nth-child(1) { animation: eqMove 0.55s infinite alternate ease-in-out; }
        .eq-box.playing .eq-bar:nth-child(2) { animation: eqMove 0.4s infinite alternate ease-in-out 0.1s; }
        .eq-box.playing .eq-bar:nth-child(3) { animation: eqMove 0.65s infinite alternate ease-in-out 0.2s; }
        .eq-box.playing .eq-bar:nth-child(4) { animation: eqMove 0.48s infinite alternate ease-in-out 0.15s; }
        .eq-box.playing .eq-bar:nth-child(5) { animation: eqMove 0.6s infinite alternate ease-in-out 0.05s; }

        @keyframes eqMove {
            0% { transform: scaleY(0.2); }
            100% { transform: scaleY(1); }
        }

        .clock-box {
            text-align: right;
            font-size: 10px;
            line-height: 1.3;
        }

        .clock-time {
            font-family: monospace;
            font-size: 11px;
            font-weight: bold;
            color: #ffffff;
        }

        .clock-date {
            font-size: 9px;
            font-weight: bold;
            color: #7dd3fc;
        }
    </style>
</head>
<body>

    <!-- 🌌 วิดีโอพื้นหลัง Background (ปิดเสียงสนิท และวนลูบต่อเนื่อง) -->
    <video id="bg-video" class="bg-video" src="https://ia601902.us.archive.org/33/items/hailuo3_20261125/hailuo3.mp4" autoplay loop muted playsinline preload="auto"></video>

    <!-- 💿 โลโก้แผ่นเสียงด้านซ้ายมือ สลับหมุน 6 ภาพ -->
    <div class="vinyl-container" id="vinyl-logo">
        <img id="vinyl-disc-img" src="https://xatimg.com/image/fjEsd5AbEVj5.png" alt="โลโก้แผ่นเสียง" class="vinyl-disc">
        <div class="vinyl-copyright">© 2026 YokkhemRadio. All rights reserved.</div>
    </div>

    <!-- 📻 กล่องวิทยุปลาทองด้านบนขวา แทนกล่องปุ่มควบคุมทั้งหมด -->
    <div class="plathong-right-box" id="plathong-right-box">
        <iframe src="https://radio.plathong.net/main/player/?server=radio9&port=7264" width="280" height="180" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <!-- 📻 กล่องรายชื่อเพลง ด้านขวาใต้กล่องวิทยุปลาทอง -->
    <div class="playlist-container" id="right-playlist">
        <img id="playlist-bg-img" src="https://xatimg.com/image/ER094pHfejKv.png" alt="" class="playlist-bg-art">

        <div class="playlist-content">
            <div class="playlist-title">
                <span>รายชื่อเพลง</span>
                <span style="font-size: 10px;" id="song-count-label">8 เพลง</span>
            </div>

            <div class="song-list" id="song-list"></div>

            <!-- ✨ ข้อความเชิญชวนใต้รายชื่อเพลง -->
            <div class="after-tracks-note">
                🔁 วนลูบต่อเนื่องครบ 8 เพลงอัตโนมัติครับ<br>
                เปิดฟังเพลินๆ กับ หยกเข้มเรดิโอ ✨
            </div>

            <!-- 📊 EQ + นาฬิกาและวันที่ -->
            <div class="right-footer-widget">
                <div class="eq-box" id="eq-box">
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                </div>
                <div class="clock-box">
                    <div class="clock-time" id="clock-time">00:00:00</div>
                    <div class="clock-date" id="clock-date">00/00/0000</div>
                </div>
            </div>
        </div>
    </div>

    <audio id="audio-player" preload="auto"></audio>

    <script>
        const bgVideo = document.getElementById('bg-video');
        function keepVideoSilentLoop() {
            bgVideo.loop = true;
            bgVideo.muted = true;
            bgVideo.volume = 0;
            bgVideo.play().catch(() => {});
        }
        keepVideoSilentLoop();
        bgVideo.addEventListener('volumechange', keepVideoSilentLoop);
        bgVideo.addEventListener('loadeddata', keepVideoSilentLoop);
        document.addEventListener('pointerdown', keepVideoSilentLoop, { once: true });

        /* 💿 รายการรูปแผ่นเสียงด้านซ้ายทั้งหมด 6 ภาพ */
        const vinylImages = [
            'https://xatimg.com/image/fjEsd5AbEVj5.png',
            'https://xatimg.com/image/XTTbqv6zoCU8.png',
            'https://xatimg.com/image/abliUvSPFlEw.png',
            'https://xatimg.com/image/nJyMBgcAguvu.png',
            'https://xatimg.com/image/UlZNA6zCRruo.png',
            'https://xatimg.com/image/U8GScSjgqNcs.png'
        ];
        let vinylImgIndex = 0;
        let vinylSlideTimer = null;
        const vinylDiscImg = document.getElementById('vinyl-disc-img');

        vinylImages.forEach((src) => {
            const preloadImg = new Image();
            preloadImg.src = src;
        });

        function startVinylSlideshow() {
            if (vinylSlideTimer) return;
            vinylSlideTimer = setInterval(() => {
                vinylDiscImg.classList.add('fading');
                setTimeout(() => {
                    vinylImgIndex = (vinylImgIndex + 1) % vinylImages.length;
                    vinylDiscImg.src = vinylImages[vinylImgIndex];
                    vinylDiscImg.classList.remove('fading');
                }, 400);
            }, 5000);
        }

        function stopVinylSlideshow() {
            if (vinylSlideTimer) {
                clearInterval(vinylSlideTimer);
                vinylSlideTimer = null;
            }
            vinylDiscImg.classList.remove('fading');
        }

        const tracks = [
            { title: 'สตริงใหม่ล่าสุด', url: 'https://ia600607.us.archive.org/28/items/sting-new/sting%20new.mp3' },
            { title: 'เพลงฮิต tiktok 2026', url: 'https://files.catbox.moe/f2ngzy.mp3' },
            { title: 'สตริง 1', url: 'https://ia601906.us.archive.org/3/items/radio_202607/1.radio.mp3' },
            { title: 'สตริง 2 ชม', url: 'https://ia601501.us.archive.org/2/items/thaistation-v.-1/thaistation%20v.1.mp3' },
            { title: 'เพลงลูกทุ่ง', url: 'https://ia600903.us.archive.org/29/items/luk-thung-music/Luk%20Thung%20music.mp3' },
            { title: 'เพลงใต้ ชุดใหม่', url: 'https://ia601609.us.archive.org/27/items/plangtai2/plangtai2.mp3' },
            { title: 'เพลงใต้ แนวเพราะ', url: 'https://files.catbox.moe/k4dtxi.mp3' },
            { title: 'ปลาทอง เรดิโอ', url: 'https://radio9.plathong.net/7264/;stream.mp3?type=http' }
        ];

        let currentIndex = 0;
        const player = document.getElementById('audio-player');
        const eqBox = document.getElementById('eq-box');
        const songListEl = document.getElementById('song-list');
        const vinylLogo = document.getElementById('vinyl-logo');

        document.getElementById('song-count-label').innerText = `${tracks.length} เพลง`;

        function setPlayingVisuals(playing) {
            if (playing) {
                eqBox.classList.add('playing');
                vinylLogo.classList.add('spinning');
                startVinylSlideshow();
            } else {
                eqBox.classList.remove('playing');
                vinylLogo.classList.remove('spinning');
                stopVinylSlideshow();
            }
        }

        function highlightSong(index, autoScroll = false) {
            for (let i = 0; i < tracks.length; i++) {
                const row = document.getElementById('song-' + i);
                if (row) row.classList.toggle('active', i === index);
            }
            if (autoScroll) {
                const activeRow = document.getElementById('song-' + index);
                if (activeRow) {
                    activeRow.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                }
            }
        }

        function renderSongList() {
            songListEl.innerHTML = '';
            tracks.forEach((track, idx) => {
                const row = document.createElement('div');
                row.id = 'song-' + idx;
                row.dataset.index = idx;
                row.className = 'song-row' + (idx === currentIndex ? ' active' : '');

                const nameSpan = document.createElement('span');
                nameSpan.className = 'song-name';
                nameSpan.innerText = `${idx + 1}. ${track.title}`;

                const tagSpan = document.createElement('span');
                tagSpan.className = 'song-tag';
                tagSpan.innerText = 'LOOP';

                row.appendChild(nameSpan);
                row.appendChild(tagSpan);
                songListEl.appendChild(row);
            });
        }

        function handleSongListTrigger(e) {
            const row = e.target.closest('.song-row');
            if (!row || !songListEl.contains(row)) return;
            e.stopPropagation();
            const idx = Number(row.dataset.index);
            if (!Number.isNaN(idx)) {
                startPlaylist(idx);
            }
        }

        songListEl.addEventListener('pointerdown', handleSongListTrigger);
        songListEl.addEventListener('click', (e) => {
            if (e.target.closest('.song-row')) {
                e.stopPropagation();
            }
        });

        function startPlaylist(index = 0) {
            currentIndex = (index + tracks.length) % tracks.length;

            player.pause();
            player.muted = false;
            player.volume = 1;
            player.src = tracks[currentIndex].url;
            player.load();

            highlightSong(currentIndex, true);
            setPlayingVisuals(true);

            const p = player.play();
            if (p !== undefined) {
                p.catch(() => {
                    setPlayingVisuals(false);
                });
            }
        }

        player.addEventListener('ended', () => {
            startPlaylist(currentIndex + 1);
        });

        renderSongList();

        function updateClock() {
            const now = new Date();
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const mo = String(now.getMonth() + 1).padStart(2, '0');
            const yyyy = now.getFullYear();

            document.getElementById('clock-time').innerText = `${hh}:${mm}:${ss}`;
            document.getElementById('clock-date').innerText = `${dd}/${mo}/${yyyy}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
