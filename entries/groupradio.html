<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>MYRADIOhit Player - Both Sides</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        /* 🌌 วิดีโอ Background ด้านหลังสุดเต็มหน้าจอ */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }

        /* 📐 จัดหน้าจอให้ชิดซ้ายและชิดขวาสุด (เว้นตรงกลางไว้ให้แชท xat) */
        body {
            background: transparent;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 10px;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* โครงสร้างแต่ละฝั่ง */
        .column {
            width: 260px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 2;
        }

        .box-media {
            position: relative;
            width: 100%;
            height: 420px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .box-media img.content-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            mix-blend-mode: screen;
            opacity: 0.9;
        }

        /* 💽 แผ่นเสียงหมุนสวยๆ */
        .vinyl-icon {
            position: absolute;
            bottom: 15px;
            width: 55px;
            height: 55px;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 60%, #000 100%);
            border: 3px solid rgba(56, 189, 248, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
        }
        .vinyl-center-dot {
            width: 18px;
            height: 18px;
            background: #0ea5e9;
            border-radius: 50%;
            border: 2px solid #fff;
        }

        @keyframes spinVinyl {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .vinyl-active {
            animation: spinVinyl 2s linear infinite;
        }

        .box-sub {
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .track-title {
            font-size: 11px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 4px;
            text-align: center;
        }

        audio {
            width: 100%;
            height: 28px;
        }
    </style>
</head>
<body>

    <!-- 🌌 วิดีโอพื้นหลัง Background -->
    <video class="bg-video" autoplay loop muted playsinline>
        <source src="https://ia601007.us.archive.org/30/items/mo_20261010/mo.mp4" type="video/mp4">
    </video>

    <!-- 👈 ฝั่งซ้าย -->
    <div class="column">
        <div class="box-media">
            <div id="vinyl-left" class="vinyl-icon" style="left: 15px;">
                <div class="vinyl-center-dot"></div>
            </div>
            <img src="https://ia601006.us.archive.org/17/items/06_20261010_202610/06.png" alt="Left Art" class="content-img">
        </div>
        <div class="box-sub">
            <div class="track-title">🎶 Left Track</div>
            <audio id="audio-left" controls crossorigin="anonymous" preload="none" src="https://files.catbox.moe/ne1srr.mp3"></audio>
        </div>
    </div>

    <!-- 👉 ฝั่งขวา -->
    <div class="column">
        <div class="box-media">
            <div id="vinyl-right" class="vinyl-icon" style="right: 15px;">
                <div class="vinyl-center-dot"></div>
            </div>
            <img src="https://ia600608.us.archive.org/8/items/07_20261010/07.png" alt="Right Art" class="content-img">
        </div>
        <div class="box-sub">
            <div class="track-title">🎵 Right Track</div>
            <audio id="audio-right" controls crossorigin="anonymous" preload="none" src="https://files.catbox.moe/deel59.mp3"></audio>
        </div>
    </div>

    <script>
        const playerLeft = document.getElementById('audio-left');
        const playerRight = document.getElementById('audio-right');
        const vinylLeft = document.getElementById('vinyl-left');
        const vinylRight = document.getElementById('vinyl-right');

        playerLeft.onplay = () => vinylLeft.classList.add('vinyl-active');
        playerLeft.onpause = () => vinylLeft.classList.remove('vinyl-active');
        playerLeft.onended = () => vinylLeft.classList.remove('vinyl-active');

        playerRight.onplay = () => vinylRight.classList.add('vinyl-active');
        playerRight.onpause = () => vinylRight.classList.remove('vinyl-active');
        playerRight.onended = () => vinylRight.classList.remove('vinyl-active');
    </script>
</body>
</html>
