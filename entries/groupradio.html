<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio/xat/THAIStation</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>
*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  background: transparent; /* พื้นหลังนอกกรอบโปร่งใส */
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  overflow: hidden;
}

/* ========================================================
   ส่วนที่ปรับแก้: ปรับกรอบไฟวิ่ง RGB ให้หนา เด่น สว่างสะใจ
   ======================================================== */
@property --angle {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}

.radio-wrapper {
  position: relative;
  width: 500px; /* ปรับขนาดรองรับขอบไฟที่หนาขึ้น */
  height: 500px;
  border-radius: 42px;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* เส้นนีออนไฟวิ่ง RGB แบบหนาพิเศษ */
.radio-wrapper::before,
.radio-wrapper::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 10px; /* <<-- เพิ่มความหนาของเส้นไฟวิ่งเป็น 10px (จากเดิม 4px) */
  background: conic-gradient(
    from var(--angle),
    #00f3ff,
    #ff007f,
    #ffe600,
    #00ff66,
    #00f3ff
  );
  -webkit-mask: 
     linear-gradient(#fff 0 0) content-box, 
     linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
  animation: rotateGlow 3.5s linear infinite;
}

/* ออร่านีออนเรืองแสงรอบนอกแบบเข้มข้น */
.radio-wrapper::after {
  filter: blur(20px); /* เพิ่มระดับความฟุ้งให้สว่างสะใจ */
  opacity: 0.9;
  z-index: -1;
}

@keyframes rotateGlow {
  to {
    --angle: 360deg;
  }
}

/* ========================================================
   ส่วนกรอบวิทยุ
   ======================================================== */
.radio-card {
  position: relative;
  width: 480px;
  height: 480px;
  border-radius: 36px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  padding: 20px;
  
  /* ภาพพื้นหลัง */
  background: url("https://xatimg.com/image/hTu7bxly5k6Y.png") center/cover no-repeat;
  
  /* เงาซ้อนขอบในภาพ */
  box-shadow: 
    inset 0 0 20px rgba(0, 243, 255, 0.5),
    0 10px 30px rgba(0, 0, 0, 0.8);
}

/* เงาไล่ระดับด้านล่างแบบโปร่งบาง ไม่บังภาพ */
.radio-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.5) 100%);
  z-index: 1;
}

/* แถบควบคุมด้านล่าง */
.bottom-panel {
  position: relative;
  z-index: 2;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  
  background: rgba(10, 10, 20, 0.25);
  padding: 12px 16px;
  border-radius: 24px;
  border: 1px solid rgba(0, 243, 255, 0.3);
  backdrop-filter: blur(3px);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), inset 0 0 10px rgba(255, 255, 255, 0.05);
}

/* 1. แถบหัวข้อสถานี + ป้าย LIVE */
.station-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
}

.station-title {
  color: #ffffff;
  font-size: 18px;
  font-weight: 700;
  text-shadow: 0 0 8px #000, 0 0 12px #00f3ff;
  letter-spacing: 0.5px;
}

.live-badge {
  background: rgba(255, 0, 0, 0.85);
  color: #ffffff;
  font-size: 9px;
  font-weight: bold;
  padding: 2px 8px;
  border-radius: 10px;
  box-shadow: 0 0 8px #ff0000;
  border: 1px solid rgba(255,255,255,0.6);
  white-space: nowrap;
  animation: livePulse 1.5s infinite alternate;
}

@keyframes livePulse {
  from { box-shadow: 0 0 4px #ff0000; transform: scale(1); }
  to { box-shadow: 0 0 12px #ff0000; transform: scale(1.05); }
}

/* 2. แถบสถานะวิทยุกำลังเล่น + คลื่นเสียง EQ */
.status-bar {
  display: flex;
  align-items: center;
  gap: 8px;
}

.status-text {
  color: #ffffff;
  font-size: 11px;
  font-weight: 600;
  text-shadow: 0 0 6px #000;
}

/* คลื่นเสียง EQ */
.wave-eq {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 12px;
}

.wave-eq span {
  width: 3px;
  height: 3px;
  background: linear-gradient(to top, #00f3ff, #ff007f);
  border-radius: 2px;
  box-shadow: 0 0 4px #00f3ff;
}

.wave-eq.playing span {
  animation: jump 0.7s infinite alternate ease-in-out;
}

.wave-eq span:nth-child(1) { animation-delay: 0.1s; }
.wave-eq span:nth-child(2) { animation-delay: 0.4s; }
.wave-eq span:nth-child(3) { animation-delay: 0.2s; }
.wave-eq span:nth-child(4) { animation-delay: 0.5s; }
.wave-eq span:nth-child(5) { animation-delay: 0.3s; }

@keyframes jump {
  0% { height: 3px; }
  100% { height: 12px; }
}

/* 3. ปุ่มกดเล่นเพลงโปร่งแสง */
.control-panel {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-top: 2px;
}

.btn {
  background: none;
  border: none;
  color: #fff;
  font-size: 15px;
  cursor: pointer;
  transition: 0.2s;
  opacity: 0.9;
  filter: drop-shadow(0 0 4px #000);
}

.btn:hover {
  opacity: 1;
  transform: scale(1.15);
  color: #00f3ff;
  text-shadow: 0 0 8px #00f3ff;
}

.btn-play {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 0, 127, 0.8), rgba(0, 243, 255, 0.8));
  color: #fff;
  font-size: 15px;
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 1;
  box-shadow: 0 0 12px rgba(0, 243, 255, 0.7);
  border: 2px solid rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(2px);
}

.btn-play:hover {
  transform: scale(1.08);
  box-shadow: 0 0 20px rgba(255, 0, 127, 1);
}

.song-name {
  color: #ffffff;
  font-size: 11px;
  font-weight: 500;
  text-shadow: 0 0 6px #000;
}
</style>
</head>

<body>

<!-- Div ครอบชั้นนอกแบบไฟวิ่งหนาพิเศษ -->
<div class="radio-wrapper">
  
  <div class="radio-card">
    
    <!-- แถบด้านล่างแบบใส มองเห็นภาพชัดเจน -->
    <div class="bottom-panel">
      
      <!-- 1. ชื่อสถานี + ป้าย LIVE -->
      <div class="station-header">
        <div class="station-title">Radio/xat/CoedMusic</div>
        <div class="live-badge">● LIVE RADIO</div>
      </div>

      <!-- 2. ป้ายวิทยุกำลังเล่น + คลื่นเสียง EQ -->
      <div class="status-bar">
        <span class="status-text">Radio Online</span>
        <div class="wave-eq" id="waveEq">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>

      <!-- 3. ปุ่มควบคุมเล่นเพลง -->
      <div class="control-panel">
        <button class="btn"><i class="fa-solid fa-backward-step"></i></button>
        <button class="btn btn-play" id="playBtn" onclick="togglePlay()">
          <i class="fa-solid fa-play" id="playIcon"></i>
        </button>
        <button class="btn"><i class="fa-solid fa-forward-step"></i></button>
      </div>

      <!-- 4. ชื่อเพลง -->
      <div class="song-name">Radio Sample @ Price 700 xat 60 days.</div>

    </div>

  </div>

</div>

<!-- เล่นไฟล์เพลง MP3 -->
<audio id="radioAudio" src="https://ia800706.us.archive.org/19/items/classic-rock_202607/Classic%20Rock.mp3"></audio>

<script>
  const audio = document.getElementById('radioAudio');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const waveEq = document.getElementById('waveEq');

  function togglePlay() {
    if (audio.paused) {
      audio.play();
      playIcon.classList.remove('fa-play');
      playIcon.classList.add('fa-pause');
      waveEq.classList.add('playing');
    } else {
      audio.pause();
      playIcon.classList.remove('fa-pause');
      playIcon.classList.add('fa-play');
      waveEq.classList.remove('playing');
    }
  }
</script>

</body>
</html>
